name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:   # allows the workflow to read repo contents (no write needed for this option)
  contents: read

env:
  FOUNDRY_PROFILE: ci

jobs:
  web:
    name: Web package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run web tests
        working-directory: web
        run: npm test

  check:
    name: Foundry project
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build Docker image
        run: docker build -f Dockerfile.foundry -t ndi-fi-foundry .

      - name: Run Forge fmt
        run: docker run --rm ndi-fi-foundry forge fmt --check

      - name: Run Forge build
        run: docker run --rm ndi-fi-foundry forge build --sizes

      - name: Run Forge tests
        run: docker run --rm ndi-fi-foundry forge test -vvv
