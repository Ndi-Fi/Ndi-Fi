name: Security Audit

on:
  schedule:
    - cron: "0 3 * * 1"   # every Monday at 03:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  security-events: write   # required to upload SARIF to the Security tab

jobs:
  slither:
    name: Slither
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@de808b1eea699e761c404bda44ba8f21aba30b2c # v1.4.0
        with:
          version: 1.2.3

      - name: Run Slither
        uses: crytic/slither-action@a9538c71ac1f22de67f6e24cfc08ce2a35e2c09f # v0.4.1
        with:
          sarif: slither.sarif
          fail-on: none   # never fail the job; findings go to the Security tab
          slither-args: --filter-paths "lib/" --exclude-dependencies

      - name: Upload Slither SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: slither.sarif
          category: slither

  semgrep:
    name: Semgrep
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Run Semgrep
        run: |
          semgrep scan \
            --config p/solidity \
            --sarif \
            --output semgrep.sarif \
            src/ || true   # do not fail the step; upload findings regardless

      - name: Upload Semgrep SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: semgrep.sarif
          category: semgrep
