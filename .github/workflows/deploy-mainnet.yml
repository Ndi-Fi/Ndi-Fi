name: Mainnet Deployment

# Gated mainnet deploy with pre-deploy checklist, manual approvals,
# post-deploy verification, and a full audit trail.
#
# Usage:
#   Trigger manually from the Actions tab on the commit you want to deploy.
#   Two reviewers listed in the "mainnet-deploy" environment must approve
#   before the deploy job runs.  Configure that environment in:
#   Settings → Environments → mainnet-deploy

on:
  workflow_dispatch:
    inputs:
      network:
        description: "Target network"
        required: true
        default: "mainnet"
        type: choice
        options:
          - mainnet
      confirm:
        description: "Type DEPLOY to confirm you have read the checklist"
        required: true
        type: string

permissions:
  contents: read
  id-token: write   # for OIDC-based cloud auth if needed

jobs:
  # ── 1. Pre-deploy checklist ───────────────────────────────────────────────
  preflight:
    name: Pre-deploy checklist
    runs-on: ubuntu-latest
    steps:
      - name: Validate confirmation input
        run: |
          if [ "${{ inputs.confirm }}" != "DEPLOY" ]; then
            echo "::error::Confirmation input must be exactly DEPLOY. Got: ${{ inputs.confirm }}"
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: 1.2.3

      - name: Checklist – run full test suite
        run: forge test -vvv
        env:
          FOUNDRY_PROFILE: ci

      - name: Checklist – build contracts (sizes)
        run: forge build --sizes
        env:
          FOUNDRY_PROFILE: ci

      - name: Checklist – confirm audit artefacts present
        run: |
          echo "=== Checking for audit reports ==="
          if ls audits/*.pdf audits/*.md 2>/dev/null | head -5; then
            echo "✅ Audit artefacts found"
          else
            echo "::warning::No audit artefacts found in audits/. Proceed only if this is intentional."
          fi

      - name: Checklist – verify deploy parameters
        run: |
          echo "=== Deploy parameters ==="
          echo "Network  : ${{ inputs.network }}"
          echo "Triggered: ${{ github.actor }} at $(date -u)"
          echo "Ref      : ${{ github.sha }}"
          echo "Workflow : ${{ github.run_id }}"

  # ── 2. Manual approval gate ───────────────────────────────────────────────
  approval-gate:
    name: Await manual approval
    needs: preflight
    runs-on: ubuntu-latest
    environment: mainnet-deploy   # configure reviewers in repo Settings → Environments
    steps:
      - name: Approval granted
        run: |
          echo "✅ Deployment approved by: ${{ github.actor }}"
          echo "Approval recorded in workflow run ${{ github.run_id }}"

  # ── 3. Deploy ─────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to ${{ inputs.network }}
    needs: approval-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: 1.2.3

      - name: Deploy contracts
        run: |
          echo "=== Starting mainnet deployment ==="
          echo "Deployer : ${{ github.actor }}"
          echo "Commit   : ${{ github.sha }}"
          echo "Run ID   : ${{ github.run_id }}"
          # Replace the line below with your actual deploy script, e.g.:
          # forge script script/Deploy.s.sol --rpc-url "$RPC_URL" --broadcast --verify
          echo "::notice::Add your forge script invocation here."
        env:
          PRIVATE_KEY: ${{ secrets.MAINNET_DEPLOYER_PRIVATE_KEY }}
          RPC_URL: ${{ secrets.MAINNET_RPC_URL }}
          ETHERSCAN_API_KEY: ${{ secrets.ETHERSCAN_API_KEY }}

  # ── 4. Post-deploy verification ───────────────────────────────────────────
  post-deploy:
    name: Post-deploy verification
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: 1.2.3

      - name: Smoke-test deployed contracts
        run: |
          echo "=== Post-deploy smoke tests ==="
          # Replace with your post-deploy verification script, e.g.:
          # forge script script/Verify.s.sol --rpc-url "$RPC_URL"
          echo "::notice::Add your post-deploy verification script here."
        env:
          RPC_URL: ${{ secrets.MAINNET_RPC_URL }}

      - name: Announce deployment
        run: |
          echo "=== Deployment summary ==="
          echo "Network  : ${{ inputs.network }}"
          echo "Deployer : ${{ github.actor }}"
          echo "Commit   : ${{ github.sha }}"
          echo "Run URL  : ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          echo "Status   : ✅ Complete"
          # Optionally post to Slack/Discord:
          # curl -s -X POST "$SLACK_WEBHOOK" -d '{"text":"Ndi-Fi deployed to mainnet ✅"}'
