name: Maintenance

on:
  schedule:
    # Run every Sunday at 02:00 UTC
    - cron: "0 2 * * 0"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  cache-prune:
    name: Prune stale caches
    runs-on: ubuntu-latest
    steps:
      - name: Delete caches older than 7 days
        uses: actions/github-script@v7
        with:
          script: |
            const caches = await github.paginate(
              github.rest.actions.getActionsCacheList,
              { owner: context.repo.owner, repo: context.repo.repo, per_page: 100 }
            );
            const cutoff = Date.now() - 7 * 24 * 60 * 60 * 1000;
            for (const cache of caches) {
              if (new Date(cache.last_accessed_at).getTime() < cutoff) {
                await github.rest.actions.deleteActionsCacheById({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  cache_id: cache.id,
                });
                core.info(`Deleted cache ${cache.id}: ${cache.key}`);
              }
            }

  storage-report:
    name: Report storage usage
    runs-on: ubuntu-latest
    steps:
      - name: Print cache storage usage
        uses: actions/github-script@v7
        with:
          script: |
            const { data } = await github.rest.actions.getActionsCacheUsage({
              owner: context.repo.owner,
              repo: context.repo.repo,
            });
            core.info(`Active caches: ${data.active_caches_count}`);
            core.info(`Total size: ${(data.active_caches_size_in_bytes / 1024 / 1024).toFixed(2)} MB`);
