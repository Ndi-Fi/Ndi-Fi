name: Deploy Stellar Contracts (Testnet)

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Optional issue/PR number to comment the deploy summary on"
        required: false
        type: string
        default: ""

permissions:
  contents: write
  issues: write
  pull-requests: write

env:
  CARGO_TERM_COLOR: always
  STELLAR_CLI_VERSION: "28.1.0"

jobs:
  deploy-testnet:
    name: Build and deploy to testnet
    runs-on: ubuntu-latest
    environment: stellar-testnet
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        working-directory: stellar
        run: |
          rustup toolchain install
          rustc --version
          cargo --version

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            stellar/target
          key: stellar-deploy-${{ runner.os }}-${{ hashFiles('stellar/Cargo.lock', 'stellar/rust-toolchain.toml') }}
          restore-keys: stellar-deploy-${{ runner.os }}-

      - name: Install Stellar CLI
        run: |
          curl -sSfL -o /tmp/stellar-cli.tar.gz \
            "https://github.com/stellar/stellar-cli/releases/download/v${STELLAR_CLI_VERSION}/stellar-cli-${STELLAR_CLI_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          mkdir -p "$HOME/.local/bin"
          tar -xzf /tmp/stellar-cli.tar.gz -C "$HOME/.local/bin" stellar
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          stellar --version

      - name: Deploy to testnet
        id: deploy
        run: |
          set -euo pipefail
          ./stellar/scripts/deploy_testnet.sh
          echo "deploy_json=stellar/deployments/testnet.json" >> "$GITHUB_OUTPUT"

      - name: Upload testnet deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: stellar-testnet-deployment
          path: stellar/deployments/testnet.json
          if-no-files-found: error

      - name: Build deploy summary
        id: summary
        run: |
          set -euo pipefail
          FILE="stellar/deployments/testnet.json"
          {
            echo "## Stellar testnet deployment"
            echo ""
            echo "- Workflow: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo "- Commit: \`${{ github.sha }}\`"
            echo ""
            echo "### Contract IDs"
            echo '```json'
            cat "$FILE"
            echo '```'
          } > /tmp/deploy-summary.md
          cat /tmp/deploy-summary.md >> "$GITHUB_STEP_SUMMARY"
          echo "body_path=/tmp/deploy-summary.md" >> "$GITHUB_OUTPUT"

      - name: Post deploy summary as commit comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('/tmp/deploy-summary.md', 'utf8');
            await github.rest.repos.createCommitComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
              body
            });

      - name: Post deploy summary to issue/PR (optional)
        if: inputs.issue_number != ''
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('/tmp/deploy-summary.md', 'utf8');
            const issue_number = Number('${{ inputs.issue_number }}');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              body
            });
