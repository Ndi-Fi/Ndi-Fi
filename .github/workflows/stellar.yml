name: Stellar (Soroban)

on:
  push:
    paths:
      - "stellar/**"
      - ".github/workflows/stellar.yml"
  pull_request:
    paths:
      - "stellar/**"
      - ".github/workflows/stellar.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    working-directory: stellar

jobs:
  check:
    name: fmt, clippy, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -f Dockerfile.stellar -t ndi-fi-stellar .

      - name: cargo fmt --check
        run: docker run --rm ndi-fi-stellar cargo fmt --all --check

      - name: cargo clippy
        run: docker run --rm ndi-fi-stellar cargo clippy --all-targets --locked -- -D warnings

      - name: cargo test
        run: docker run --rm ndi-fi-stellar cargo test --locked

      - name: stellar contract build
        run: |
          docker run --rm ndi-fi-stellar bash -c "stellar --version && stellar contract build"
          docker run --rm ndi-fi-stellar bash -c "for c in ndi_token ndi_lending ndi_staking; do test -f \"target/wasm32v1-none/release/\${c}.wasm\" && ls -l \"target/wasm32v1-none/release/\${c}.wasm\"; done"
