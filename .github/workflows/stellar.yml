name: Stellar (Soroban)

on:
  push:
    paths:
      - "stellar/**"
      - ".github/workflows/stellar.yml"
  pull_request:
    paths:
      - "stellar/**"
      - ".github/workflows/stellar.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    working-directory: stellar

jobs:
  check:
    name: fmt, clippy, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -f Dockerfile.stellar -t ndi-fi-stellar .

      - name: cargo fmt --check
        run: docker run --rm ndi-fi-stellar cargo fmt --all --check

      - name: cargo clippy
        run: docker run --rm ndi-fi-stellar cargo clippy --all-targets --locked -- -D warnings

      - name: cargo test
        run: docker run --rm ndi-fi-stellar cargo test --locked

      - name: stellar contract build
        run: |
          docker run --name stellar-build ndi-fi-stellar bash -c "stellar --version && stellar contract build && for c in ndi_token ndi_lending ndi_staking; do test -f \"target/wasm32v1-none/release/\${c}.wasm\" && ls -l \"target/wasm32v1-none/release/\${c}.wasm\"; done"
          # Copy the built contracts out of the container so they can be uploaded.
          mkdir -p target/wasm32v1-none/release
          for c in ndi_token ndi_lending ndi_staking; do
            docker cp "stellar-build:/app/stellar/target/wasm32v1-none/release/${c}.wasm" target/wasm32v1-none/release/
          done
          docker rm stellar-build

      # Retention is documented in CONTRIBUTING.md ("Build artifacts").
      - name: Upload compiled .wasm contracts
        uses: actions/upload-artifact@v4
        with:
          name: stellar-wasm-${{ github.sha }}
          path: |
            stellar/target/wasm32v1-none/release/ndi_token.wasm
            stellar/target/wasm32v1-none/release/ndi_lending.wasm
            stellar/target/wasm32v1-none/release/ndi_staking.wasm
          if-no-files-found: error
          retention-days: 14
