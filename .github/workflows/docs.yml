name: Docs

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Only one Pages deployment may run at a time.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build Solidity API reference
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: 1.2.3

      - name: Generate and build contract docs
        run: forge doc --build

      - name: Check generated docs location
        run: test -f docs/reference/solidity/book/index.html

      - name: Upload docs site
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/reference/solidity/book

  deploy:
    name: Publish docs site
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
