name: Nightly Invariant Tests

# Runs expensive invariant / property tests on a schedule so they don't block
# every PR.  Can also be dispatched manually for investigation.
#
# Reproduce locally:
#   cd stellar
#   cargo test --locked -- --include-ignored invariant
#   # For Foundry invariants:
#   forge test --match-path "test/invariant/**" -vvv
on:
  schedule:
    # 02:00 UTC every day
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

env:
  FOUNDRY_PROFILE: ci
  CARGO_TERM_COLOR: always

jobs:
  stellar-invariants:
    name: Stellar property tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: |
          cd stellar
          rustup toolchain install
          rustc --version
          cargo --version

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            stellar/target
          key: stellar-invariant-${{ runner.os }}-${{ hashFiles('stellar/Cargo.lock', 'stellar/rust-toolchain.toml') }}
          restore-keys: stellar-invariant-${{ runner.os }}-

      - name: Run invariant / property tests
        working-directory: stellar
        run: cargo test --locked -- --include-ignored invariant

  foundry-invariants:
    name: Foundry invariant tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: 1.2.3

      - name: Run Foundry invariant tests
        run: forge test --match-path "test/invariant/**" -vvv

  notify-on-failure:
    name: Open issue on failure
    runs-on: ubuntu-latest
    needs: [stellar-invariants, foundry-invariants]
    if: failure() && github.event_name == 'schedule'
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const title = `🚨 Nightly invariant tests failed (${new Date().toISOString().slice(0,10)})`;
            const body = [
              `One or more invariant / property test suites failed in the nightly run.`,
              '',
              `**Run:** https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              '',
              '## Reproduce locally',
              '```bash',
              '# Stellar',
              'cd stellar',
              'cargo test --locked -- --include-ignored invariant',
              '',
              '# Foundry',
              'forge test --match-path "test/invariant/**" -vvv',
              '```',
            ].join('\n');

            // Check if an open issue already exists to avoid duplicates.
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: 'invariant-failure',
              state: 'open',
            });

            if (issues.length === 0) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['invariant-failure', 'ci'],
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issues[0].number,
                body: `Failure repeated: https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              });
            }
