[workspace]
resolver = "2"
members = ["contracts/*", "tests"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
repository = "https://github.com/Ndi-Fi/Ndi-Fi"

# Exact pins. stellar-* 0.8.0 requires soroban-sdk ^28, so soroban-sdk 29.x is not usable yet.
[workspace.dependencies]
soroban-sdk = "=28.0.0"
stellar-tokens = "=0.8.0"
stellar-access = "=0.8.0"
stellar-contract-utils = "=0.8.0"
stellar-macros = "=0.8.0"
ndi-token = { path = "contracts/ndi_token" }
ndi-lending = { path = "contracts/ndi_lending" }
ndi-staking = { path = "contracts/ndi_staking" }

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

[profile.release-with-logs]
inherits = "release"
debug-assertions = true
